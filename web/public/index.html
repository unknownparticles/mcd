<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>麦门今日签 · MBTI × 天气 × 节气</title>
<style>
  :root {
    --red: #DA291C;
    --red-dark: #B71C13;
    --yellow: #FFC72C;
    --yellow-soft: #FFE9B3;
    --cream: #FFF8EC;
    --ink: #2B2118;
    --ink-soft: #7A6A55;
    --green: #0F8A5F;
    --card: #FFFFFF;
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #DA291C 0%, #E04A22 240px, var(--cream) 240px);
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 0 16px 80px; }

  /* ---------- header ---------- */
  header { text-align: center; padding: 40px 0 92px; color: #fff; }
  .arch { font-size: 44px; line-height: 1; filter: drop-shadow(0 4px 10px rgba(0,0,0,.18)); }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: 10px; margin: 10px 0 8px; text-shadow: 0 2px 8px rgba(0,0,0,.2); }
  h1 span { color: var(--yellow); }
  .tagline { font-size: 13px; opacity: .92; letter-spacing: 1px; }
  .badges { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 4px 12px; border: 1px solid rgba(255,255,255,.55); border-radius: 999px; letter-spacing: 1px; }

  /* ---------- panel overlapping header ---------- */
  .panel { background: var(--card); border-radius: var(--radius); padding: 22px 20px; box-shadow: 0 12px 32px rgba(150, 60, 20, .16); margin-top: -64px; }
  .step-label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--ink-soft); letter-spacing: 2px; margin-bottom: 12px; }
  .step-label .num { width: 20px; height: 20px; border-radius: 50%; background: var(--yellow); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; }

  /* ---------- MBTI grid ---------- */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .mbti {
    padding: 11px 0 8px; text-align: center; border-radius: 12px; cursor: pointer; user-select: none;
    border: 1.5px solid #F1E3C8; background: #FFFBF2; transition: all .15s ease;
  }
  .mbti b { display: block; font-size: 14px; color: var(--ink); }
  .mbti i { display: block; font-style: normal; font-size: 10px; color: var(--ink-soft); margin-top: 2px; }
  .mbti:hover { border-color: var(--yellow); }
  .mbti.on { background: var(--red); border-color: var(--red); box-shadow: 0 6px 14px rgba(218,41,28,.32); transform: translateY(-2px); }
  .mbti.on b { color: #fff; } .mbti.on i { color: rgba(255,255,255,.85); }

  /* ---------- inputs ---------- */
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .fields input { grid-column: span 1; }
  input {
    width: 100%; padding: 12px 14px; border: 1.5px solid #F1E3C8; border-radius: 12px;
    font-size: 14px; background: #FFFBF2; color: var(--ink); outline: none; transition: border .15s;
  }
  input:focus { border-color: var(--yellow); background: #fff; }
  input::placeholder { color: #C4B299; }

  /* ---------- CTA ---------- */
  .go {
    width: 100%; margin-top: 18px; padding: 16px; font-size: 17px; font-weight: 800; letter-spacing: 6px;
    color: var(--ink); background: linear-gradient(135deg, var(--yellow), #FFB81C);
    border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 8px 20px rgba(255,184,28,.4);
    transition: transform .12s;
  }
  .go:active { transform: scale(.97); }
  .go:disabled { opacity: .55; cursor: wait; }

  /* ---------- fortune box loading ---------- */
  .shake { display: none; text-align: center; padding: 30px 0 10px; font-size: 40px; }
  .shake.on { display: block; animation: rattle .5s infinite; }
  @keyframes rattle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg) translateY(-2px)} 75%{transform:rotate(8deg)} }
  .shake p { font-size: 13px; color: var(--ink-soft); margin-top: 8px; letter-spacing: 2px; }

  /* ---------- sign card (签纸) ---------- */
  .sign-card {
    display: none; margin-top: 22px; position: relative; overflow: hidden;
    background: linear-gradient(180deg, #FFFDF6, #FFF6E0);
    border-radius: var(--radius); box-shadow: 0 12px 32px rgba(150,60,20,.16);
    border: 1px solid #F3E3C0;
  }
  .sign-card.show { display: block; animation: rise .45s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; } }
  .sign-top { background: var(--red); color: #fff; text-align: center; padding: 18px 20px 22px; position: relative; }
  .sign-top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 16px; background: radial-gradient(circle at 12px -6px, transparent 12px, #FFFDF6 13px) repeat-x; background-size: 24px 16px; }
  .grade-chip { display: inline-block; background: var(--yellow); color: var(--ink); font-weight: 800; font-size: 13px; letter-spacing: 4px; padding: 5px 18px; border-radius: 999px; }
  .sign-title { font-size: 21px; font-weight: 800; margin-top: 12px; line-height: 1.4; }
  .sign-price { margin-top: 8px; }
  .sign-price b { font-size: 30px; color: var(--yellow); }
  .sign-price s { opacity: .65; margin-left: 8px; font-size: 14px; }
  .sign-price .save { display: inline-block; margin-left: 10px; font-size: 12px; background: rgba(255,255,255,.18); padding: 2px 10px; border-radius: 999px; }
  .sign-body { padding: 6px 22px 24px; }
  .fortune {
    margin: 14px 0; padding: 16px 18px; background: #fff; border-radius: 14px;
    border: 1.5px dashed #E8C88A; font-size: 14.5px; line-height: 2; color: #6B4A12; text-align: center;
    position: relative;
  }
  .fortune::before, .fortune::after { content: "❝"; position: absolute; color: #E8C88A; font-size: 22px; }
  .fortune::before { left: 12px; top: 6px; } .fortune::after { content: "❞"; right: 12px; bottom: 6px; }
  .pill-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 4px; }
  .pill { font-size: 11.5px; color: var(--ink-soft); background: #F7EEDC; padding: 4px 12px; border-radius: 999px; }
  .pill.hot { color: var(--red-dark); background: #FDE8E5; font-weight: 700; }
  .alts { margin-top: 18px; }
  .alts-title { font-size: 12px; color: var(--ink-soft); letter-spacing: 2px; margin-bottom: 8px; text-align: center; }
  .alt { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; background: #fff; border-radius: 10px; margin-bottom: 6px; font-size: 13px; }
  .alt .g { color: var(--red); font-weight: 700; margin-right: 8px; }
  .alt .p { color: var(--ink-soft); }

  /* ---------- seal + order ---------- */
  .order-zone { margin-top: 20px; text-align: center; }
  .btn-order {
    padding: 14px 34px; font-size: 15px; font-weight: 800; letter-spacing: 2px; color: #fff;
    background: linear-gradient(135deg, var(--red), var(--red-dark)); border: none; border-radius: 999px;
    cursor: pointer; box-shadow: 0 8px 20px rgba(218,41,28,.35); transition: transform .12s;
  }
  .btn-order:active { transform: scale(.96); }
  .order-note { font-size: 11px; color: var(--ink-soft); margin-top: 8px; }

  .pay-panel { display: none; margin-top: 16px; background: #fff; border-radius: 14px; padding: 18px; border: 1.5px solid #F1E3C8; }
  .pay-panel.show { display: block; animation: rise .4s ease; }
  .stepper { display: flex; justify-content: space-between; position: relative; margin: 6px 6px 18px; }
  .stepper::before { content: ""; position: absolute; top: 9px; left: 24px; right: 24px; height: 2px; background: #EFE3CC; }
  .st { position: relative; z-index: 1; text-align: center; font-size: 11px; color: #B7A88E; width: 72px; }
  .st .dot { width: 20px; height: 20px; border-radius: 50%; background: #EFE3CC; margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; }
  .st.done { color: var(--green); font-weight: 700; }
  .st.done .dot { background: var(--green); }
  .st.cur { color: var(--red); font-weight: 700; }
  .st.cur .dot { background: var(--red); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(218,41,28,.4)} 50%{box-shadow:0 0 0 7px rgba(218,41,28,0)} }
  .pay-link {
    display: block; text-align: center; padding: 12px; background: #FFF6E0; border-radius: 10px;
    color: var(--red-dark); font-weight: 700; font-size: 14px; text-decoration: none;
  }
  .order-meta { font-size: 12px; color: var(--ink-soft); margin-top: 10px; text-align: center; line-height: 1.8; }
  .pickup { text-align: center; margin-top: 6px; }
  .pickup .code { font-size: 40px; font-weight: 900; color: var(--red); letter-spacing: 6px; }
  .pickup .lbl { font-size: 12px; color: var(--ink-soft); letter-spacing: 3px; }
  .btn-poll { margin-top: 14px; padding: 11px 26px; font-size: 13px; font-weight: 700; border-radius: 999px; border: 1.5px solid var(--red); background: #fff; color: var(--red); cursor: pointer; }
  .btn-cancel { margin-top: 10px; font-size: 12px; color: #B7A88E; background: none; border: none; cursor: pointer; text-decoration: underline; }

  .err { color: #A32D2D; font-size: 13px; text-align: center; margin-top: 10px; min-height: 18px; }

  footer { text-align: center; margin-top: 34px; font-size: 11px; color: #C4B299; line-height: 2; }
  footer b { color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="arch">🍟</div>
    <h1>麦门<span>今日签</span></h1>
    <div class="tagline">你的 MBTI，决定你在麦门的命</div>
    <div class="badges">
      <span class="badge">MBTI 人格</span><span class="badge">实时天气</span><span class="badge">节气节日</span><span class="badge">真实券后价</span>
    </div>
  </header>

  <div class="panel">
    <div class="step-label"><span class="num">1</span>选你的命格</div>
    <div class="grid" id="grid"></div>

    <div class="step-label" style="margin-top:20px"><span class="num">2</span>告诉我你在哪</div>
    <div class="fields">
      <input id="city" placeholder="城市" value="厦门">
      <input id="kw" placeholder="地标（如：观音山）">
      <input id="budget" placeholder="预算上限 ¥（可选）" style="grid-column: span 2">
    </div>

    <button class="go" id="go">求 一 签</button>
    <div class="err" id="err1"></div>
    <div class="shake" id="shake">🥡<p>正在摇签筒…</p></div>
  </div>

  <div class="sign-card" id="signCard">
    <div class="sign-top">
      <div class="grade-chip" id="grade"></div>
      <div class="sign-title" id="pname"></div>
      <div class="sign-price"><b id="price"></b><s id="orig"></s><span class="save" id="save" style="display:none"></span></div>
    </div>
    <div class="sign-body">
      <div class="fortune" id="fortune"></div>
      <div class="pill-row" id="pills"></div>
      <div class="alts" id="alts"></div>
      <div class="order-zone">
        <button class="btn-order" id="orderBtn">🙏 应签下单</button>
        <div class="order-note">生成待支付订单 · 支付由你本人完成 · AI 不碰钱</div>
      </div>

      <div class="pay-panel" id="payPanel">
        <div class="stepper">
          <div class="st" id="st1"><div class="dot">1</div>待支付</div>
          <div class="st" id="st2"><div class="dot">2</div>配餐中</div>
          <div class="st" id="st3"><div class="dot">3</div>已完成</div>
        </div>
        <a class="pay-link" id="payLink" target="_blank">📲 点此支付（建议发到微信里打开）</a>
        <div class="order-meta" id="orderMeta"></div>
        <div class="pickup" id="pickup" style="display:none">
          <div class="lbl">取 餐 码</div>
          <div class="code" id="pickupCode"></div>
        </div>
        <button class="btn-poll" id="pollBtn">我付完了，查状态</button>
        <button class="btn-cancel" id="cancelBtn">取消这单</button>
      </div>
      <div class="err" id="err2"></div>
    </div>
  </div>

  <footer>
    <b>麦门今日签</b> · WorkBuddy Skill × 麦当劳 MCP<br>
    真实菜单 · 真实门店 · 真实优惠券 · 全链路真实下单
  </footer>
</div>

<script>
const PERSONA = {
  INTJ:"效率军师", INTP:"思想哲学家", ENTJ:"指挥官", ENTP:"辩论家",
  INFJ:"神秘引路人", INFP:"氛围诗人", ENFJ:"主人公", ESFP:"派对动物",
  ISTJ:"守序会计师", ISFJ:"暖心管家", ESTJ:"执行官", ESFJ:"东道主",
  ISTP:"酷手匠人", ISFP:"冒险艺术家", ESTP:"街头玩家", ENFP:"快乐小狗",
};
const MBTI = Object.keys(PERSONA);
let picked = null, lastSign = null, lastOrderId = null;
const $ = id => document.getElementById(id);

const grid = $("grid");
MBTI.forEach(t => {
  const d = document.createElement("div");
  d.className = "mbti";
  d.innerHTML = `<b>${t}</b><i>${PERSONA[t]}</i>`;
  d.onclick = () => { picked = t; [...grid.children].forEach(c => c.classList.remove("on")); d.classList.add("on"); };
  grid.appendChild(d);
});
MBTI.forEach(() => {}); // keep order
grid.children[15].classList.add("on"); picked = "ENFP"; // default pick ENFP

function setStep(n) {
  [1,2,3].forEach(i => $("st"+i).className = "st" + (i <= n ? (i === n ? " cur" : " done") : ""));
  $("st"+n).querySelector(".dot").textContent = n;
}

$("go").onclick = async () => {
  if (!picked) { $("err1").textContent = "先选一个 MBTI，麦门不收无命之人"; return; }
  $("err1").textContent = ""; $("go").disabled = true;
  $("shake").classList.add("on"); $("signCard").classList.remove("show"); $("payPanel").classList.remove("show");
  try {
    const r = await fetch("/api/recommend", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mbti: picked, city: $("city").value.trim(), keyword: $("kw").value.trim() || undefined,
        budget: $("budget").value.trim() || undefined }) });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    lastSign = j.sign; lastSign.storeCode = j.store.storeCode; lastOrderId = null;
    $("grade").textContent = j.sign.grade;
    $("pname").textContent = j.sign.product;
    $("price").textContent = "¥" + j.sign.price;
    $("orig").textContent = j.sign.origPrice > j.sign.price ? "¥" + j.sign.origPrice : "";
    const saveEl = $("save");
    if (j.sign.origPrice > j.sign.price) {
      saveEl.style.display = "inline-block";
      saveEl.textContent = "立省 ¥" + (j.sign.origPrice - j.sign.price).toFixed(1);
    } else saveEl.style.display = "none";
    $("fortune").textContent = j.sign.fortune;
    const pills = [`${PERSONA[picked]} · ${j.toneStyle}`, j.date + (j.term ? " · " + j.term : "") + (j.festival ? " · " + j.festival : ""), j.weather.line, j.store.storeName];
    if (j.sign.coupon) pills.push("🎫 " + j.sign.coupon.title);
    $("pills").innerHTML = pills.map(p => `<span class="pill">${p}</span>`).join("");
    $("alts").innerHTML = `<div class="alts-title">—— 备 选 签 位 ——</div>` +
      j.alternatives.map(a => `<div class="alt"><span><span class="g">${a.grade}</span>${a.product}</span><span class="p">¥${a.price}</span></div>`).join("");
    $("payPanel").classList.remove("show");
    $("signCard").classList.add("show");
    $("signCard").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) { $("err1").textContent = "求签失败：" + e.message; }
  $("go").disabled = false; $("shake").classList.remove("on");
};

$("orderBtn").onclick = async () => {
  const s = lastSign;
  if (!s) return;
  if (!confirm(`应签下单确认\n\n【${s.product}】\n¥${s.price} · 堂食\n\n将生成待支付订单，支付由你本人完成。`)) return;
  $("orderBtn").disabled = true; $("err2").textContent = "";
  try {
    const payload = { storeCode: s.storeCode, orderType: 1, beType: 1, takeWayCode: "eat-in",
      items: [{ productCode: s.code, quantity: 1 }] };
    const r = await fetch("/api/order", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ payload }) });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    lastOrderId = j.orderId;
    setStep(1);
    $("payLink").href = j.payH5Url;
    $("orderMeta").textContent = `订单 ${j.orderId.slice(-8)} · 待支付 ¥${j.amount} · ${j.store ?? ""}`;
    $("pickup").style.display = "none";
    $("payPanel").classList.add("show");
    $("payPanel").scrollIntoView({ behavior: "smooth", block: "center" });
  } catch (e) { $("err2").textContent = "下单失败：" + e.message; }
  $("orderBtn").disabled = false;
};

$("pollBtn").onclick = async () => {
  if (!lastOrderId) { $("err2").textContent = "还没有订单，先应签下单"; return; }
  $("err2").textContent = "";
  try {
    const r = await fetch("/api/poll", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ orderId: lastOrderId }) });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    const s = j.status ?? "";
    const paid = !/待支付|待付|unpaid/i.test(s);
    const done = /已完成|完成|completed/i.test(s);
    setStep(done ? 3 : (paid ? 2 : 1));
    $("orderMeta").textContent = `订单状态：${s} · 实付 ¥${j.amount ?? "?"}`;
    if (j.pickupCode) { $("pickupCode").textContent = j.pickupCode; $("pickup").style.display = "block"; }
  } catch (e) { $("err2").textContent = "查询失败：" + e.message; }
};

$("cancelBtn").onclick = async () => {
  if (!lastOrderId) return;
  if (!confirm("确定取消这个待支付订单吗？")) return;
  try {
    const r = await fetch("/api/cancel", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ orderId: lastOrderId }) });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    $("payPanel").classList.remove("show");
    $("err2").textContent = "";
    $("orderMeta").textContent = "订单已取消";
  } catch (e) { $("err2").textContent = "取消失败：" + e.message; }
};
</script>
</body>
</html>
